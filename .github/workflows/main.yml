name: Send Message to Telegram and wechat

permissions:
  contents: write
  actions: write  # 清理旧 run 记录需要

on:
  workflow_dispatch:  # 允许手动触发 
  schedule:
    - cron: '30 3 1,5,9,13,17,21,25,29 * *'  # 每隔 3 天的早上 6 点 30 分执行,北京时间 14:30
  push:
    branches:
      - main  # 或其他你希望触发的分支（加上这个玩意就会邮件提醒你脚本执行了）
jobs:
  send_message:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'  # 使用合适的 Python 版本

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run login.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CUSTOM_MESSAGE: ${{ secrets.CUSTOM_MESSAGE }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WX_MESSAGE_TITLE: ${{ secrets.WX_MESSAGE_TITLE }}
          WX_MESSAGE_CONTENT: ${{ secrets.WX_MESSAGE_CONTENT }}
        run: |
          python reminder.py
      - name: Commit time.txt to repo
        env:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 如果 time.txt 不存在，说明是第一次运行
          if [ ! -f time.txt ]; then
            echo "首次生成时间：$(date +'%Y-%m-%d %H:%M:%S')" > time.txt
          else
            echo "$(date +'%Y-%m-%d %H:%M:%S')" > time.txt
          fi

          git add time.txt

          # 如果有更改再提交
          if git diff --cached --quiet; then
            echo "无变化，无需提交"
          else
            git commit -m "⏱️ 更新时间文件: $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin HEAD:main
          fi

      # 清理旧 run 记录，只保留本 workflow 最新 1 条
      - name: Clean up old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}  # 内置 token，已声明 actions:write
        run: |
          # 本 workflow 的所有 completed run id（含本次，最新在前）
          older_ids=$(gh api "repos/${{ github.repository }}/actions/runs?workflow_file=main.yml&per_page=100" \
            --jq '[.workflow_runs[] | select(.status == "completed") | .id] | .[1:][]')
          for id in $older_ids; do
            echo "删除旧 run: $id"
            gh run delete "$id" --repo "${{ github.repository }}" --yes || echo "删除失败(跳过): $id"
          done
